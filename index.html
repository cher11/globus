<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Глобус</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: the board is a sheet of squared notebook paper on a desk; beside it, a margin-ruled score page holds players, actions and the log. */
:root {
  --desk: #e2e7ee;
  --paper: #fbfcfd;
  --ink: #1b2331;
  --ink-soft: #5a6577;
  --rule: #d2dbe6;
  --margin: rgba(208, 82, 76, .55);
  --pen: #2152a3;
  --pen-ink: #ffffff;
  --mark: #fff0a6;
  --btn: #eef2f7;
  --btn-hover: #e1e8f1;
  --scrim: rgba(18, 24, 34, .45);
  --shadow: 0 1px 2px rgba(27, 35, 49, .08), 0 8px 24px rgba(27, 35, 49, .10);
  --p-red: #c3302c; --p-blue: #1f4f9e; --p-green: #28783a; --p-violet: #7a3cb4;
  /* board (paper) */
  --b-land: #fdfdfb; --b-sea: #c5dcf1; --b-hatch: #a8c6e4; --b-grid: #d0dae7; --b-shore: #2d6195;
  --b-burnt: #22252c; --b-burnt2: #3c414b; --b-label: #8b97a9; --b-label-hi: #2152a3; --b-target: #d3222a;
  --font-hand: 'Caveat', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
  --font-body: 'PT Sans', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'PT Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #12161d; --paper: #1b212b; --ink: #e4e8ef; --ink-soft: #9aa5b7; --rule: #2d3644;
    --margin: rgba(214, 92, 86, .5); --pen: #8db0ee; --pen-ink: #0f1520; --mark: #463f1f;
    --btn: #242c38; --btn-hover: #2d3745; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    --p-red: #ff8077; --p-blue: #86aef2; --p-green: #74c886; --p-violet: #be93f2;
    --b-land: #e1e5eb; --b-sea: #a3c1de; --b-hatch: #89aacb; --b-grid: #bdc8d5; --b-shore: #29527c;
    --b-burnt: #101216; --b-burnt2: #2a2e36; --b-label: #7d899b; --b-label-hi: #2152a3; --b-target: #d6232b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #12161d; --paper: #1b212b; --ink: #e4e8ef; --ink-soft: #9aa5b7; --rule: #2d3644;
  --margin: rgba(214, 92, 86, .5); --pen: #8db0ee; --pen-ink: #0f1520; --mark: #463f1f;
  --btn: #242c38; --btn-hover: #2d3745; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  --p-red: #ff8077; --p-blue: #86aef2; --p-green: #74c886; --p-violet: #be93f2;
  --b-land: #e1e5eb; --b-sea: #a3c1de; --b-hatch: #89aacb; --b-grid: #bdc8d5; --b-shore: #29527c;
  --b-burnt: #101216; --b-burnt2: #2a2e36; --b-label: #7d899b; --b-label-hi: #2152a3; --b-target: #d6232b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--desk); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; }
.app { max-width: 1500px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 28px; display: flex; flex-direction: column; gap: 12px; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; flex-wrap: wrap; }
.logo { font-family: var(--font-hand); font-weight: 700; font-size: 46px; line-height: .9; color: var(--pen); margin: 0; }
.tagline { color: var(--ink-soft); font-size: 14px; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.turn-pill { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); padding-inline: 4px; }

.btn { color: var(--ink); background: var(--btn); border: 1px solid var(--rule); border-radius: 7px; padding: 6px 12px; font-size: 14px; cursor: pointer; transition: background-color .15s; }
.btn:hover:not(:disabled) { background: var(--btn-hover); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: var(--pen); filter: brightness(1.08); }
.btn.big { padding: 10px 16px; font-size: 15px; width: 100%; }
.btn:focus-visible, .seg button:focus-visible, .unit-btn:focus-visible, .name-in:focus-visible, .x:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; flex-shrink: 0; }
.seg button { background: var(--btn); color: var(--ink-soft); border: 0; padding: 5px 10px; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 700; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 352px; gap: 16px; align-items: start; }
.board-col { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.board-scroll { overflow: auto; max-width: 100%; padding-bottom: 2px; }
.sheet { position: relative; width: max-content; margin: 0 auto; background: var(--b-land); box-shadow: var(--shadow); border-radius: 2px; padding: 6px; }
#board { display: block; touch-action: manipulation; cursor: crosshair; }
.cell-info { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); min-height: 1.5em; text-align: center; overflow-wrap: anywhere; }

.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); max-height: calc(100vh - 24px); overflow: auto;
  background: linear-gradient(to right, transparent 29px, var(--margin) 29px, var(--margin) 31px, transparent 31px), var(--paper);
  box-shadow: var(--shadow); border-radius: 3px; padding: 14px 16px 18px 46px; display: flex; flex-direction: column; gap: 18px; }
.panel section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.label { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); margin: 0; font-weight: 700; }
.hand { font-family: var(--font-hand); font-weight: 700; font-size: 32px; line-height: 1; margin: 0; text-wrap: balance; }
.hint { color: var(--ink-soft); font-size: 13.5px; margin: 0; }
.lead { margin: 0; font-size: 14px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.pl { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; padding: 6px 8px; border-radius: 6px; }
.pl.cur { background: var(--mark); }
.pl.out { opacity: .5; }
.pl.out .pl-name { text-decoration: line-through; }
.sw { width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .2); flex-shrink: 0; }
.pl-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-cr { font-family: var(--font-mono); font-size: 19px; font-variant-numeric: tabular-nums; text-align: right; }
.pl-cr small { font-size: 11px; color: var(--ink-soft); margin-left: 3px; }
.pl-sub { grid-column: 2 / 4; font-size: 12.5px; color: var(--ink-soft); }
.tag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; margin-left: 6px; font-weight: 400; vertical-align: 2px; }

.turn-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.turn-head .hand { color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.harvest { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%; padding: 10px 12px; text-align: left; }
.harvest b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.harvest small { color: var(--ink-soft); font-size: 12.5px; }
.unit-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.unit-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; border: 1px solid var(--rule); border-radius: 8px; background: var(--btn); color: var(--ink); cursor: pointer; min-width: 0; transition: background-color .15s; }
.unit-btn:hover:not(:disabled) { background: var(--btn-hover); }
.unit-btn[aria-pressed="true"] { background: var(--mark); border-color: var(--ink-soft); }
.unit-btn:disabled { opacity: .38; cursor: not-allowed; }
.unit-btn canvas { width: 30px; height: 30px; }
.unit-btn .nm { font-size: 12.5px; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
.unit-btn .cost { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); }
.act-card { display: flex; align-items: center; gap: 12px; }
.act-card canvas { width: 40px; height: 40px; flex-shrink: 0; }
.act-name { font-weight: 700; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--rule); background: var(--btn); }
.chip.done { opacity: .55; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.row-btns .btn { flex: 1 1 auto; }
.check { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--pen); }
.check small { display: block; color: var(--ink-soft); font-size: 12.5px; }
.thinking::after { content: ''; display: inline-block; width: 1.2em; }

.log { list-style: none; margin: 0; padding: 0; font-size: 13px; display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow: auto; }
.log li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; line-height: 1.35; }
.log .tn { font-family: var(--font-mono); color: var(--ink-soft); font-size: 11.5px; padding-top: 1px; }
.log .who { font-weight: 700; color: var(--c); }
.log .win { font-weight: 700; }

.setup-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.setup-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.name-in { flex: 1 1 110px; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; }
.x { border: 0; background: transparent; color: var(--ink-soft); font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.x:hover { background: var(--btn); color: var(--ink); }
.map-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
#mini { width: 100%; max-width: 246px; height: auto; border-radius: 2px; box-shadow: var(--shadow); }

.toast { position: absolute; left: 50%; top: 16%; transform: translate(-50%, -8px); font-family: var(--font-hand); font-weight: 700; font-size: 44px; line-height: 1.05; color: var(--c); background: var(--paper); padding: 4px 22px 8px; border-radius: 6px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.over-card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--paper); box-shadow: var(--shadow); border-radius: 4px; padding: 18px 26px 22px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(360px, 88%); }
.over-card .hand { font-size: 52px; color: var(--c); }
.over-card p { margin: 0; }

.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal-card { position: relative; background: linear-gradient(to right, transparent 33px, var(--margin) 33px, var(--margin) 35px, transparent 35px), var(--paper); width: min(780px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: 4px; box-shadow: var(--shadow); padding: 22px 26px 26px 54px; }
.modal-card h2 { font-size: 40px; margin-bottom: 8px; }
.modal-card h3 { font-size: 15px; margin: 18px 0 6px; }
.modal-card p, .modal-card li { max-width: 66ch; }
.modal-card p { margin: 0 0 8px; }
.modal-card ul, .modal-card ol { margin: 0 0 8px; padding-left: 20px; }
.modal-card li { margin-bottom: 4px; }
.modal-close { position: absolute; top: 12px; right: 12px; }
.tbl-wrap { overflow-x: auto; }
.tbl { border-collapse: collapse; font-size: 13.5px; min-width: 520px; }
.tbl th, .tbl td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl th { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); }
.tbl td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

@media (max-width: 940px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; }
  .logo { font-size: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .btn, .unit-btn { transition: none; }
}
</style>

<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1 class="logo">Глобус</h1>
      <span class="tagline" id="tagline"></span>
    </div>
    <div class="tools">
      <span class="turn-pill" id="turnPill"></span>
      <div class="seg" role="group" id="speedSeg" aria-label="speed">
        <button type="button" data-act="speed" data-v="1">×1</button>
        <button type="button" data-act="speed" data-v="2">×2</button>
        <button type="button" data-act="speed" data-v="4">×4</button>
      </div>
      <button type="button" class="btn" data-act="rules" id="rulesBtn"></button>
      <button type="button" class="btn" data-act="newgame" id="newBtn"></button>
      <button type="button" class="btn" data-act="lang" id="langBtn"></button>
    </div>
  </header>
  <main class="main">
    <div class="board-col">
      <div class="board-scroll">
        <div class="sheet">
          <canvas id="board" width="900" height="760" aria-label="Game board"></canvas>
          <div class="toast" id="toast"></div>
          <div class="over-card" id="overCard" hidden>
            <div class="hand" id="overTitle"></div>
            <p id="overText"></p>
            <button type="button" class="btn primary" data-act="newgame" id="overBtn"></button>
          </div>
        </div>
      </div>
      <div class="cell-info" id="cellInfo"></div>
    </div>
    <aside class="panel" id="panel"></aside>
  </main>
</div>
<div class="modal" id="rulesModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <button type="button" class="btn modal-close" data-act="close-rules" id="rulesClose">×</button>
    <div id="rulesBody"></div>
  </div>
</div>

<script>
(() => {
'use strict';

// ===================== Geometry =====================
const W = 41, H = 34, N = W * H, TAU = Math.PI * 2;
const DX = [1, 1, 0, -1, -1, -1, 0, 1], DY = [0, 1, 1, 1, 0, -1, -1, -1];
const LAND = 0, SEA = 1;
const cx = c => c % W, cy = c => (c / W) | 0;
const NB = new Int32Array(N * 8);
for (let c = 0; c < N; c++) for (let d = 0; d < 8; d++) {
  const x = cx(c) + DX[d], y = cy(c) + DY[d];
  NB[c * 8 + d] = (x >= 0 && y >= 0 && x < W && y < H) ? y * W + x : -1;
}
const cheb = (a, b) => Math.max(Math.abs(cx(a) - cx(b)), Math.abs(cy(a) - cy(b)));
const coord = c => `${cx(c) + 1}:${cy(c) + 1}`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function forLanes(from, range, fn) {
  for (let d = 0; d < 8; d++) { let c = from; for (let r = 1; r <= range; r++) { c = NB[c * 8 + d]; if (c < 0) break; fn(c, d, r); } }
}
function bfs(sources, pass) {
  const dist = new Float32Array(N).fill(Infinity), q = new Int32Array(N); let h = 0, t = 0;
  for (const s of sources) if (s >= 0 && dist[s] === Infinity && (!pass || pass[s])) { dist[s] = 0; q[t++] = s; }
  while (h < t) {
    const c = q[h++];
    for (let d = 0; d < 8; d++) { const n = NB[c * 8 + d]; if (n < 0 || dist[n] !== Infinity || (pass && !pass[n])) continue; dist[n] = dist[c] + 1; q[t++] = n; }
  }
  return dist;
}
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const newSeed = () => 10000 + Math.floor(Math.random() * 90000);

// ===================== Map =====================
function genMap(seed) {
  const rnd = mulberry32(seed), M = 7, t = new Array(N).fill(LAND);
  const wig = n => { const a = []; let v = (rnd() * 3) | 0; for (let i = 0; i < n; i++) { if (rnd() < 0.32) v = clamp(v + (rnd() < 0.5 ? -1 : 1), 0, 2); a.push(v); } return a; };
  const top = wig(W), bot = wig(W), lef = wig(H), rig = wig(H);
  const cut = [0, 1, 2, 3].map(() => 1 + ((rnd() * 3) | 0));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (x < M + lef[y] || x > W - 1 - M - rig[y] || y < M + top[x] || y > H - 1 - M - bot[x]) continue;
    const dx = Math.min(x - M, W - 1 - M - x), dy = Math.min(y - M, H - 1 - M - y);
    if (dx + dy < cut[(x < W / 2 ? 0 : 1) + (y < H / 2 ? 0 : 2)]) continue;
    t[y * W + x] = SEA;
  }
  for (let pass = 0; pass < 2; pass++) for (let c = 0; c < N; c++) {
    let sea = 0;
    for (let d = 0; d < 8; d++) { const n = NB[c * 8 + d]; if (n >= 0 && t[n] === SEA) sea++; }
    if (t[c] === LAND && sea >= 6) t[c] = SEA; else if (t[c] === SEA && sea <= 2) t[c] = LAND;
  }
  const islands = 1 + ((rnd() * 3) | 0);
  for (let i = 0, tries = 0; i < islands && tries < 400; tries++) {
    const land = []; for (let c = 0; c < N; c++) if (t[c] === LAND) land.push(c);
    const dl = bfs(land, null);
    const c0 = (rnd() * N) | 0;
    if (t[c0] !== SEA || dl[c0] < 5) continue;
    const size = 2 + ((rnd() * 6) | 0), cells = [c0]; t[c0] = LAND;
    for (let a = 0; a < 80 && cells.length < size; a++) {
      const b = cells[(rnd() * cells.length) | 0], n = NB[b * 8 + [0, 2, 4, 6][(rnd() * 4) | 0]];
      if (n >= 0 && t[n] === SEA && dl[n] >= 3) { t[n] = LAND; cells.push(n); }
    }
    i++;
  }
  return t;
}

// ===================== Units =====================
const TYPES = ['human', 'field', 'factory', 'artillery', 'aa', 'tank', 'sub', 'aircraft', 'battleship'];
const BIT = {}; TYPES.forEach((t, i) => { BIT[t] = 1 << i; });
const ALL = (1 << TYPES.length) - 1;
const U = {
  human:      { cost: 0,  dom: 'land', move: 0,  guns: [], val: 40, shape: 'round' },
  field:      { cost: 0,  dom: 'land', move: 0,  guns: [], yield: 1, val: 5, shape: 'square' },
  factory:    { cost: 10, dom: 'land', move: 0,  guns: [], yield: 5, val: 16, shape: 'square' },
  artillery:  { cost: 10, dom: 'land', move: 0,  guns: [{ range: 5, mask: ALL & ~BIT.aircraft }], val: 12, shape: 'square' },
  aa:         { cost: 10, dom: 'land', move: 0,  guns: [{ range: 5, mask: BIT.aircraft }], val: 10, shape: 'square' },
  tank:       { cost: 20, dom: 'land', move: 5,  cls: 'land', guns: [{ range: 1, mask: ALL & ~BIT.aircraft }], val: 22, shape: 'round' },
  sub:        { cost: 30, dom: 'sea',  move: 5,  cls: 'sea', guns: [{ range: 1, mask: BIT.sub | BIT.battleship }], val: 28, shape: 'round' },
  aircraft:   { cost: 40, dom: 'any',  move: 10, cls: 'air', guns: [{ range: 1, mask: ALL & ~BIT.sub }], val: 36, shape: 'round' },
  battleship: { cost: 50, dom: 'sea',  move: 5,  cls: 'sea', guns: [{ range: 5, mask: ALL & ~BIT.sub & ~BIT.aircraft }], val: 46, shape: 'round' },
};
const AA_GUN = { range: 5, mask: BIT.aircraft, aa: true };
function gunsOf(u) { const g = U[u.type].guns.slice(); if (u.type === 'battleship' && u.cargo === 'aa') g.unshift(AA_GUN); return g; }
const canAct = u => gunsOf(u).length > 0 || U[u.type].move > 0;
const hasHuman = u => u.type === 'human' || u.cargo === 'human';
const valueOf = u => U[u.type].val + (u.cargo === 'human' ? U.human.val : u.cargo === 'aa' ? U.aa.val : 0);

// ===================== Game state =====================
function makeGame(cfg) {

<h2 class="hand" id="rulesTitle">Правила «Глобуса»</h2>
<p>Пошаговая стратегия на поле 41×34 клетки. Цель — уничтожить всех людей противника. Игрок, у которого не осталось людей (считая людей на линкорах), выбывает, а его юниты сгорают. Выбывает и тот, кому в начале хода нечего делать, кроме урожая: нет места для постройки, ни один юнит не может сходить и выстрелить не по кому.</p>

<p>Суша белая, море синее. Море лежит в центре, не ближе 7 клеток к краю поля, берег извилистый (до 2 клеток), в море есть несколько островов. В клетке может стоять только один юнит. Клетка, которую юнит покинул или по которой попали, сгорает — чернеет до конца игры, и занять её больше нельзя.</p>

<p>Игроки ходят по очереди. Первым ходом каждый ставит человека в любую клетку у края поля. Дальше за ход — ровно одно действие:</p>

<h3>Юниты</h3>${table}

<h3>Как прочитаны неясные места</h3>
<ul>
<li>Зенитка стреляет только по самолётам (в исходном тексте опечатка). Самолёт могут сбить только зенитка — на суше или на линкоре — и другой самолёт.</li>
<li>Выстрел не тратит ход: за ход можно сделать одно действие и один выстрел любым юнитом. Линкор с зениткой тоже стреляет один раз — из пушки или из зенитки.</li>

<h2 class="hand" id="rulesTitle">The rules of Globus</h2>
<p>A turn-based strategy game on a 41×34 grid. The goal is to destroy every enemy human. A player with no humans left (counting humans aboard battleships) is out, and their units burn. So is a player who starts a turn with nothing to do but harvest: no room to build, no unit that can move and nothing to fire at.</p>
<h3>The field</h3>
<p>Land is white, sea is blue. The sea sits in the centre, at least 7 cells from the edge, with a shoreline that wanders by up to 2 cells and a few islands. A cell holds one unit. A cell that a unit leaves or that gets hit is destroyed: it turns black for the rest of the game and can never be used again.</p>
<h3>Turns</h3>
<p>Players move in order. On their first turn each player places a human on any cell along the edge of the field. After that, every turn is exactly one action:</p>
<ol><li><b>Build</b> a unit on one of the 8 cells around one of your humans.</li><li><b>Move</b> one unit.</li><li><b>Collect the harvest</b> from all your fields and factories.</li></ol><p>In addition, once per turn you may fire with any one of your units, before or after the action.</p>
<p>Everyone can see everyone's credits.</p>
<h3>Units</h3>${table}
<h3>Movement</h3>
<p>A unit moves in a straight line in one of 8 directions for exactly its full range; it cannot stop early. The final cell must be intact and not hold one of your own units (enemy units: see below); the path may cross any cells. A unit may turn only when it runs into a boundary: if the next cell ahead is a shore or the edge of the field, it bounces and may continue in any direction. Moving along a boundary, it cannot turn whenever it likes. Aircraft bounce only off the edges of the field. Tanks never enter the sea, ships never go ashore.</p>
<h3>Firing</h3>
<p>In a straight line in 8 directions, at any distance from 1 to the unit's range, over other cells. The hit unit is destroyed and the cell burns.</p>
<h3>Battleships</h3>
<p>A battleship can carry a human or an AA gun, not both. To load one, build a human or an AA gun directly on the battleship's cell while it is next to one of your humans. A carried human can land on adjacent land, islands included, to start a new colony.</p>
<h3>How unclear points are read</h3>
<ul>
<li>The AA gun fires only at aircraft (the original text has a typo). Aircraft can be shot down only by AA guns, on land or aboard a battleship, and by other aircraft.</li>
<li>Firing does not use up the turn: one action plus one shot with any unit per turn. A battleship carrying an AA gun also fires once, with either gun.</li>
<li>Only enemy units can be fired at.</li>
<li>Submarines move exactly 5 cells, like everything else.</li>
<li>A tank crushes its path by default: enemy humans, fields and factories die, empty cells burn. Your own units and aircraft (the tank drives under them) are spared. Crushing can be switched off.</li>
<li>An enemy tank, artillery or AA gun on a tank's path means a ram (crushing or not): both are destroyed, the cell burns and the tank's move ends there.</li>
<li>Ending a move on an enemy: a tank or an aircraft destroys a human, field or factory and takes the cell. A ram is a tank on a tank, artillery or AA gun, an aircraft on an aircraft, a submarine on a submarine or a battleship on a battleship: both are destroyed and the cell burns. Nothing else can be reached.</li>
<li>Units on different levels, air (aircraft), surface (everything on land and battleships) and underwater (submarines), never crush or ram each other: aircraft and submarines pass over and under anything, a tank drives under aircraft, a battleship passes over submarines.</li>
<li>A landed human leaves the battleship, which can then be loaded again.</li>
<li>The game is a draw if nobody has room to build, a shot or a move left, or if nothing is destroyed for 150 turns in a row, so a game cannot drag on forever.</li>
</ul>
<h3>Controls</h3>
<ul>
<li>Build: pick a unit in the panel, then click a highlighted cell.</li>
<li>Act: click one of your units. Red crosshair: fire. Ring: where the move can end; hover it to see the path, click to go. Dots: the next step, to lay the path yourself.</li>
<li>Keys: H harvest, 1–9 pick a unit, Esc step back or cancel, Enter end turn.</li>
</ul>`;
}

// ===================== App state =====================

// ===================== Animations =====================
function anim(dur, draw) {

}
function flushAnims() { const a = anims; anims = []; a.forEach(x => x.res()); }
const cellXY = c => [OX + cx(c) * CS, OY + cy(c) * CS];

function animMove(u, path, crush) {

// ===================== Actions (shared by people and the computer) =====================
function track(kind, v) { if (!G.now) G.now = { p: G.cur, trail: [], shots: [], marks: [] }; G.now[kind].push(v); }

  const p = G.cur, info = buildTargets(G, p, type).get(cell);

  applyBuild(G, p, type, cell, info);
  track('marks', cell);
  addLog({ k: info.mode, p, t: type, c: cell });
  renderAll();
  await ringAnim(cell, pcolor(p));
  return true;
}
async function doHarvest() {
  const p = G.cur, n = yieldOf(G, p);

  addLog({ k: n ? 'harvest' : 'pass', p, n });
  renderAll();

    const color = pcolor(p), list = unitList(G).filter(u => u.owner === p && U[u.type].yield);

}

  if (!gun || !victim) return;
  await animShot(from, cell, pcolor(u.owner));
  if (tok !== gameToken) return;
  killAt(G, cell);
  G.lastKill = G.turn;
  track('shots', [from, cell]);
  addLog({ k: 'kill', p: u.owner, t: gun.aa ? 'aa' : u.type, from, c: cell, v: victim.type, vc: victim.cargo, vp: victim.owner });

  await boom(cell);
  if (tok === gameToken) postKill();
}

  const from = u.cell;
  path = path.slice(0, moveEnd(G, u, path) + 1);
  await animMove(u, path, crush);
  if (tok !== gameToken) return;
  const ev = applyMove(G, id, path, crush);
  if (ev.some(e => e.victim)) G.lastKill = G.turn;
  track('trail', [from, ...path]);
  addLog({ k: 'move', p: u.owner, t: u.type, from, c: path[path.length - 1], crush: u.type === 'tank' && crush });
  for (const e of ev) if (e.victim) addLog({ k: e.kind, p: u.owner, t: u.type, c: e.cell, v: e.victim.type, vc: e.victim.cargo, vp: e.victim.owner });
  renderAll();

  r.cells.forEach(c => boom(c));
  if (G.winner >= 0) {
    addLog({ k: 'win', p: G.winner });
    UI.mode = 'over'; UI.sel = null; UI.busy = false; UI.hidden = 0;
    commit(); renderAll();
  } else if (r.out.length) renderAll();
}

function beginTurn(resumed) {
  if (UI.mode !== 'play') { renderAll(); return; }
  const stuck = checkStuck(G, G.cur);
  if (stuck) {
    addLog({ k: 'stuck', p: G.cur });
    stuck.forEach(c => boom(c));
    if (G.winner >= 0) { addLog({ k: 'win', p: G.winner }); UI.mode = 'over'; UI.sel = null; UI.busy = false; commit(); renderAll(); return; }
    nextPlayer(G); commit(); beginTurn(false);
    return;
  }
  const P = G.players[G.cur];
  if (!G.now) G.now = { p: G.cur, trail: [], shots: [], marks: [] };
  UI.sel = null; UI.busy = false; UI.turn = { act: false, shot: false };
  if (!P.ai && !P.placed) UI.sel = { kind: 'build', type: 'human', targets: buildTargets(G, G.cur, 'human') };
  renderAll();
  const people = G.players.filter(q => !q.ai && q.alive).length;

// The computer pauses while the new-game panel is open.
let gateWaiters = [];
const gate = () => UI.view === 'setup' ? new Promise(r => gateWaiters.push(r)) : Promise.resolve();

// A test can plug another decision module in for a seat: { aiThink, aiBestShot, aiContext }
const BRAINS = {};
async function aiTurn() {
  const tok = gameToken, ok = () => tok === gameToken && UI.mode === 'play', p = G.cur, B = BRAINS[p] || { aiThink, aiBestShot, aiContext };
  UI.busy = true; renderPanel();
  await sleep(320);
  await gate();
  if (!ok()) return;
  const think = shotFree => { try { return B.aiThink(G, p, null, shotFree); } catch (err) { console.error(err); return { kind: 'harvest' }; } };
  const validShot = (id, gi, c) => { const u = G.units[id], gun = u && gunsOf(u)[gi]; return !!gun && targetsFrom(G, p, u.cell, gun).includes(c); };
  const act = async a => {
    if (a.kind === 'harvest') await doHarvest();
    else if (a.kind === 'build') await doBuild(a.type, a.cell);
    else if (a.path && G.units[a.id] && new Solver(G, G.units[a.id]).dest(a.path[a.path.length - 1])) await doMove(a.id, a.path, a.crush);

    await act(a);
    await gate(); if (!ok()) return;

  } else {
    if (a.shot && G.players[p].placed) {
      await doShot(a.shot.id, a.shot.gi, a.shot.c); shot = true;
      await gate(); if (!ok()) return;
      a = think(false);
    }
    await act(a);
  }
  await gate(); if (!ok()) return;
  if (!shot && G.players[p].placed) {
    let s2 = null;
    try { s2 = B.aiBestShot(G, B.aiContext(G, p)); } catch (err) { console.error(err); }
    if (s2 && s2.v > 0) await doShot(s2.id, s2.gi, s2.c);
  }
  await gate();
  if (ok()) finishTurn();

// ===================== People's turn =====================
// A turn is one action (build, move or harvest) plus one shot with any unit, in either order.
function anyShot(p) { for (const u of unitList(G)) if (u.owner === p) for (const gun of gunsOf(u)) if (targetsFrom(G, p, u.cell, gun).length) return true; return false; }
async function humanAction(fn, kind) {
  if (!isHumanTurn()) return;
  const tok = gameToken;
  UI.busy = true; renderPanel(); requestDraw();
  try { await fn(); } catch (err) { console.error(err); }
  if (tok !== gameToken || UI.mode !== 'play') return;
  UI.turn[kind] = true;
  UI.busy = false;

  if (UI.sel && UI.sel.kind === 'act') { recomputeAct(); const s = UI.sel; if (s && !s.targets.size && (UI.turn.act || !s.canMove)) UI.sel = null; }

function uiGain(u, s) {

  if (u.type === 'tank') return () => 0;
  return () => 0;
}

  recomputeAct(); renderAll();
}

    case 'kill': return t('lKill', uname(e.t), coord(e.from), coord(e.c), vic, vp, S.gender[e.v] || 0);
    case 'crush': return t('lCrush', coord(e.c), vic, vp, S.gender[e.v] || 0);
    case 'smash': return t('lSmash', uname(e.t), coord(e.c), vic, vp, S.gender[e.v] || 0);
    case 'ram': return t('lRam', uname(e.t), coord(e.c), vic, vp);
    case 'out': return t('lOut');
    case 'stuck': return t('lStuck');
    case 'win': return `<span class="win">${t('lWin')}</span>`;
    case 'draw': return `<span class="win">${cap(G.draw === 'calm' ? t('lDrawCalm', CALM_TURNS) : t('lDraw'))}</span>`;
  }
  return '';
}
function renderLog() {
  const items = G.log.slice(-80).reverse();
  if (!items.length) return `<p class="hint">${t('logEmpty')}</p>`;
  return `<ol class="log">${items.map(e => `<li><span class="tn">${e.tn}</span><span>${e.k === 'draw' ? '' : `<span class="who" style="--c:${pvar(e.p)}">${esc(pname(e.p))}</span> · `}${fmtLog(e)}</span></li>`).join('')}</ol>`;
}
function renderSetup() {
  const used = new Set(setup.players.map(sp => sp.color));
  let h = `<section><h2 class="hand">${t('setupTitle')}</h2><p class="lead">${t('setupLead')}</p></section>`;
  h += `<section><p class="label">${t('playersL')}</p><ul class="setup-list">`;
  setup.players.forEach((sp, i) => {
    const id = PCOLORS[sp.color].id;
    h += `<li class="setup-row"><span class="sw" style="--c:${PCOLORS[sp.color].ink}"></span>
      <input class="name-in" id="pname-${id}" data-i="${i}" value="${esc(sp.name)}" placeholder="${esc(STR[LANG].colors[id])}" maxlength="18" aria-label="${t('nameL')}">
      <div class="seg" role="group"><button type="button" data-act="ctl" data-i="${i}" data-v="0" aria-pressed="${!sp.ai}">${t('ctlHuman')}</button><button type="button" data-act="ctl" data-i="${i}" data-v="1" aria-pressed="${sp.ai}">${t('ctlAI')}</button></div>
      ${setup.players.length > 2 ? `<button type="button" class="x" data-act="rm" data-i="${i}" aria-label="${t('remove')}" title="${t('remove')}">×</button>` : ''}</li>`;
  });
  h += `</ul>${used.size < PCOLORS.length ? `<button type="button" class="btn" data-act="add">+ ${t('addPlayer')}</button>` : ''}</section>`;
  h += `<section><div class="map-row"><span class="mono">${t('mapN', setup.seed)}</span><button type="button" class="btn" data-act="reroll">${t('reroll')}</button></div>${UI.mode !== 'none' ? '<canvas id="mini"></canvas>' : ''}</section>`;
  h += `<section><button type="button" class="btn primary big" data-act="start">${t('start')}</button>${UI.mode !== 'none' ? `<button type="button" class="btn" data-act="back">${t('back')}</button>` : ''}</section>`;
  return h;
}
function renderPanel() {
  const panel = $('#panel');
  if (UI.view === 'setup') {
    panel.innerHTML = renderSetup();
    const mini = $('#mini'); if (mini) drawMini(mini, setup.seed);
    return;
  }
  let h = `<section>${renderPlayers()}</section>`;
  if (UI.mode === 'play') h += `<section>${renderActions()}</section>`;
  else if (UI.mode === 'over' && G.draw) h += `<section><div class="turn-head" style="--c:var(--ink)"><span class="hand">${t('drawTitle')}</span></div><p class="lead">${drawText()}</p><button type="button" class="btn primary big" data-act="newgame">${t('newGame')}</button></section>`;
  else if (UI.mode === 'over') h += `<section><div class="turn-head" style="--c:${pvar(G.winner)}"><span class="sw" style="--c:${pcolor(G.winner)}"></span><span class="hand">${t('winTitle')}</span></div><p class="lead">${esc(t('winText', pname(G.winner)))}</p><button type="button" class="btn primary big" data-act="newgame">${t('newGame')}</button></section>`;
  h += `<section><p class="label">${t('logL')}</p>${renderLog()}</section>`;
  const scroll = panel.querySelector('.log')?.scrollTop || 0;
  panel.innerHTML = h;
  const log = panel.querySelector('.log'); if (log) log.scrollTop = scroll;
  const d = window.devicePixelRatio || 1;
  panel.querySelectorAll('canvas[data-icon]').forEach(cv => {
    const px = cv.clientWidth || 30; cv.width = cv.height = Math.round(px * d);
    drawToken(cv.getContext('2d'), cv.dataset.icon, cv.dataset.cargo || null, 0, 0, cv.width, pcolor(G.cur));
  });
}
function renderInfo() {
  const el = $('#cellInfo'), c = UI.hover;
  if (!G || c < 0) { el.textContent = t('infoIdle'); return; }
  const parts = [coord(c), G.terrain[c] === LAND ? t('terrLand') : t('terrSea')];
  if (G.burnt[c]) parts.push(t('terrBurnt'));
  const u = unitAt(G, c);
  if (u) parts.push(`${uname(u.type, true)} (${pname(u.owner)})${u.cargo ? `, ${t('cargoL')}: ${uname(u.cargo)}` : ''}`);
  el.textContent = parts.join(' · ');
}
function renderAll() { renderHeader(); renderPanel(); renderInfo(); requestDraw(); }

// ===================== Events =====================
function cellFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left - OX) / CS), y = Math.floor((e.clientY - r.top - OY) / CS);
  return (x >= 0 && y >= 0 && x < W && y < H) ? y * W + x : -1;
}
canvas.addEventListener('pointermove', e => { const c = cellFromEvent(e); if (c !== UI.hover) { UI.hover = c; renderInfo(); requestDraw(); } });
canvas.addEventListener('pointerleave', () => { UI.hover = -1; renderInfo(); requestDraw(); });
canvas.addEventListener('click', e => { const c = cellFromEvent(e); UI.hover = c; renderInfo(); onBoardClick(c); requestDraw(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  switch (a) {
    case 'harvest': harvestNow(); break;
    case 'build': toggleBuild(b.dataset.type); break;
    case 'undo': undoStep(); break;
    case 'cancel': cancelSel(); break;
    case 'end': endTurnNow(); break;
    case 'speed': SPEED = +b.dataset.v; save(); renderHeader(); break;
    case 'lang': LANG = LANG === 'ru' ? 'en' : 'ru'; save(); renderAll(); if (!$('#rulesModal').hidden) $('#rulesBody').innerHTML = rulesHTML(); break;
    case 'rules': $('#rulesBody').innerHTML = rulesHTML(); $('#rulesModal').hidden = false; $('#rulesClose').focus(); break;
    case 'close-rules': $('#rulesModal').hidden = true; break;
    case 'newgame': openSetup(); break;
    case 'ctl': setup.players[i].ai = b.dataset.v === '1'; renderPanel(); break;
    case 'add': { const used = new Set(setup.players.map(sp => sp.color)); const col = PCOLORS.findIndex((_, k) => !used.has(k)); if (col >= 0) setup.players.push({ color: col, name: '', ai: true }); renderPanel(); break; }
    case 'rm': if (setup.players.length > 2) setup.players.splice(i, 1); renderPanel(); break;
    case 'reroll': setup.seed = newSeed(); if (UI.mode === 'none') { G = makeGame({ seed: setup.seed, players: [] }); buildTerrain(); } renderPanel(); break;
    case 'start': startGame(); break;
    case 'back': backToGame(); break;
  }
});
$('#rulesModal').addEventListener('click', e => { if (e.target.id === 'rulesModal') e.currentTarget.hidden = true; });
document.addEventListener('input', e => { if (e.target.matches('.name-in')) setup.players[+e.target.dataset.i].name = e.target.value; });
document.addEventListener('change', e => { if (e.target.id === 'crushBox' && UI.sel && UI.sel.kind === 'act') { UI.sel.crush = e.target.checked; recomputeAct(); requestDraw(); } });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === 'Escape') {
    if (!$('#rulesModal').hidden) { $('#rulesModal').hidden = true; return; }
    const s = UI.sel; if (s && s.kind === 'act' && s.path.length) undoStep(); else cancelSel();
    return;
  }
  if (!$('#rulesModal').hidden) return;
  if (e.key === 'Enter') { if (!e.target.closest('button')) endTurnNow(); return; }
  const k = e.key.toLowerCase();
  if (k === 'h' || k === 'р') { harvestNow(); return; }
  if (/^[1-9]$/.test(e.key)) toggleBuild(TYPES[+e.key - 1]);
});
const onTheme = () => { readPalette(); buildTerrain(); renderPanel(); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
new ResizeObserver(() => layout()).observe($('.board-col'));
window.addEventListener('resize', layout);

// ===================== Boot =====================
function boot(data) {
  const saved = (data && data.save) || loadSaved();
  if (saved) {
    if (saved.lang === 'ru' || saved.lang === 'en') LANG = saved.lang;
    if ([1, 2, 4].includes(saved.speed)) SPEED = saved.speed;
    if (saved.setup && Array.isArray(saved.setup.players) && saved.setup.players.length >= 2) setup = saved.setup;
  }
  readPalette();
  const g = saved && saved.G;
  if (g && g.v === 1 && Array.isArray(g.terrain) && g.terrain.length === N && g.players && g.players.length >= 2) {
    G = g; UI.mode = (G.winner >= 0 || G.draw) ? 'over' : 'play'; UI.view = 'game'; committed = JSON.stringify(G);
  } else {
    G = makeGame({ seed: setup.seed, players: [] }); UI.mode = 'none'; UI.view = 'setup';
  }
  layout(); renderAll();
  requestAnimationFrame(loop);
  if (UI.mode === 'play') beginTurn(true);
}
try { window.claude?.hot?.snapshot?.(() => ({ save: JSON.parse(savedString()) })); } catch (e) { /* no viewer hook */ }

window.__globus = {
  get G() { return G; }, get UI() { return UI; },
  setInstant(v) { INSTANT = !!v; },
  start(players, seed) { setup = { players, seed: seed || newSeed() }; startGame(); },
  aiThink, aiContext, aiNextValue, aiCrushNext, aiBestShot, aiRisk, aiWorth, Solver, buildTargets, genMap, applyMove, arrival, pathVictims, moveEnd,
  render: () => renderAll(), cells: c => ({ x: cx(c), y: cy(c) }),
  brain(p, b) { if (b) BRAINS[p] = b; else delete BRAINS[p]; },
  // engine names the computer player uses, to compile another version's AI section against this engine
  lib: { W, H, N, NB, DX, DY, LAND, SEA, cx, cy, cheb, coord, clamp, forLanes, bfs, TYPES, BIT, ALL, U, AA_GUN, gunsOf, canAct, hasHuman, valueOf,
    unitAt, isFree, terrainOk, unitList, humansOf, yieldOf, statics, buildTargets, applyBuild, STRUCT, TANK_RAM, arrival, moveEnd, killAt, targetsFrom, pathVictims, applyMove, OPP, nextDirs, Solver },
};
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
})();
</script>
