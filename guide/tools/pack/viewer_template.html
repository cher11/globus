<script>
/* Map files are fetched whole, as early as possible, while the libraries below load. The page answers
   MapLibre's mem:// tile and glyph requests from these buffers. The small tile file comes first. */
window.__dl = (() => {
  const U = { lo: "__TILES_LO_URL__", hi: "__TILES_HI_URL__", gl: "__GLYPHS_URL__" };
  const st = { prog: {}, onp: null };
  const get = k => fetch(U[k]).then(async r => {
    if (!r.ok) throw new Error(k + " " + r.status);
    const total = +r.headers.get("content-length") || 0, rd = r.body.getReader(), ch = [];
    let n = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; ch.push(value); n += value.length; st.prog[k] = [n, total]; if (st.onp) st.onp(); }
    const out = new Uint8Array(n); let o = 0;
    for (const c of ch) { out.set(c, o); o += c.length; }
    // Artifacts serve no binary types, so the files may be published as base64 text (*.b64.txt).
    if (/\.b64\.txt$/.test(U[k])) {
      const s = atob(new TextDecoder().decode(out).replace(/\s+/g, "")), b = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
      return b.buffer;
    }
    return out.buffer;
  });
  st.gl = get("gl"); st.lo = get("lo");
  st.hi = st.lo.catch(() => {}).then(() => get("hi"));
  return st;
})();
</script>

<script>
const DATA = /*__DATA__*/;
const BASE = /*__BASEMAP__*/;

const GROUPS = {sights:"Достопримечательности", museums_art:"Музеи", nature_views:"Природа и виды",
  food:"Еда", cafes:"Кафе", bars_nightlife:"Бары и ночь", culture_events:"Культура",
  sports_active:"Спорт", sports_watch:"Спорт: смотреть", family:"С детьми", wellness:"Купальни и спа",
  shopping:"Покупки", lodging:"Жильё", practical:"Практичное"};
const SRC = {osm:"OSM", zuerich_tourism:"Tourism", wikidata:"Wikidata", wikivoyage:"Wikivoyage", wikipedia:"Wikipedia", stadt_zuerich:"Город"};
const MARKS = [["good","хорошо"],["junk","мусор"],["wrong_cat","не та категория"],["dup","дубль"],["closed","закрыто"]];
const PAGE = 20;

const el = id => document.getElementById(id);
const P = DATA.places;
const byId = new Map(P.map(p => [p.i, p]));
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
P.forEach(p => { p._n = norm(p.n + " " + (p.alt || "")); });

const state = { grp: "sights", kreis: "all", q: "", shown: PAGE, sel: null, marks: new Map() };
try { const g = localStorage.getItem("zh-grp"); if (g && GROUPS[g]) state.grp = g; } catch (e) {}

// ---------- map ----------
// Vector basemap: OSM tiles (Shortbread schema) and label glyphs come from two files and one glyph bundle that
// the page downloads whole and answers MapLibre's "mem://" requests from; it never asks another host for map data.
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const [W, S, E, N] = BASE.bbox;
const FONT = ["Noto Sans Regular"];
const KREISE = { type: "FeatureCollection", features: [
  ...BASE.border.map(l => ({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: l } })),
  ...BASE.labels.map(l => ({ type: "Feature", properties: { t: "KREIS " + l.t }, geometry: { type: "Point", coordinates: [l.lon, l.lat] } }))] };
const EMPTY = { type: "FeatureCollection", features: [] };
const feed = { dots: EMPTY, pins: EMPTY };   // our places, kept so they can be set again once the style is loaded

function makeStyle() {
  const c = Object.fromEntries(["land", "water", "green", "road", "road-casing", "road-major", "road-major-casing", "path", "rail", "border", "bld",
    "bld-line", "landuse", "lbl", "halo", "lbl-water", "lbl-park", "poi", "accent", "accent-ink", "surface"].map(k => [k, css("--" + k)]));
  const zw = (...a) => ["interpolate", ["exponential", 1.5], ["zoom"], ...a];
  const kind = (...k) => ["match", ["get", "kind"], k, true, false];
  const named = ["!=", ["coalesce", ["get", "name"], ""], ""];
  const notTunnel = ["!=", ["get", "tunnel"], true];
  const MAJOR = ["motorway", "motorway_link", "trunk", "trunk_link", "primary", "primary_link"];
  const MID = ["secondary", "secondary_link", "tertiary", "tertiary_link"];
  const MINOR = ["residential", "unclassified", "living_street", "pedestrian", "road"];
  const PATH = ["footway", "path", "steps", "cycleway", "bridleway", "track", "pedestrian_path"];
  const RAIL = ["rail", "light_rail", "narrow_gauge", "funicular", "monorail"];
  const TRAM = ["tram", "subway", "busway"];
  const name = ["coalesce", ["get", "name"], ["get", "name_de"]];
  const halo = { "text-color": c.lbl, "text-halo-color": c.halo, "text-halo-width": 1.4, "text-halo-blur": 0.3 };
  const L = [];
  const add = (id, sl, type, filter, paint, layout = {}, extra = {}) => L.push({ id, type, source: "osm", "source-layer": sl, ...(filter ? { filter } : {}), paint, layout, ...extra });
  L.push({ id: "bg", type: "background", paint: { "background-color": c.land } });
  const GREEN = ["forest", "wood", "park", "grass", "meadow", "garden", "scrub", "grassland", "recreation_ground", "allotments", "playground", "village_green",
    "cemetery", "golf_course", "pitch", "nature_reserve", "orchard", "vineyard", "greenfield", "heath", "farmland", "dog_park", "common", "flowerbed"];
  add("landuse", "land", "fill", kind("industrial", "commercial", "retail", "railway", "brownfield", "construction", "quarry", "landfill", "garages"), { "fill-color": c.landuse });
  add("green", "land", "fill", kind(...GREEN), { "fill-color": c.green, "fill-opacity": ["match", ["get", "kind"], ["farmland", "meadow", "grassland", "greenfield", "grass"], 0.6, 1] });
  add("water", "water_polygons", "fill", null, { "fill-color": c.water });
  add("water-line-minor", "water_lines", "line", kind("stream", "ditch", "drain"), { "line-color": c.water, "line-width": zw(13, 0.6, 18, 3) }, {}, { minzoom: 13 });
  add("water-line", "water_lines", "line", kind("river", "canal"), { "line-color": c.water, "line-width": zw(10, 0.8, 14, 3, 18, 12) });
  add("street-area", "street_polygons", "fill", null, { "fill-color": c.road, "fill-opacity": 0.9 }, {}, { minzoom: 14 });
  add("bld", "buildings", "fill", null, { "fill-color": c.bld, "fill-outline-color": c.bld }, {}, { minzoom: 14 });
  add("bld-line", "buildings", "line", null, { "line-color": c["bld-line"], "line-width": 0.6 }, {}, { minzoom: 16 });
  // roads: tunnels faint, then casings, then fills, small ways above
  add("tunnel", "streets", "line", ["all", ["==", ["get", "tunnel"], true], kind(...MAJOR, ...MID, ...MINOR)], { "line-color": c["road-casing"], "line-opacity": 0.55, "line-width": zw(13, 0.8, 18, 8), "line-dasharray": [2, 1] }, { "line-cap": "butt" }, { minzoom: 13 });
  const road = (id, kinds, w, wc, minzoom, fill, casing) => {
    const f = ["all", notTunnel, kind(...kinds)];
    add(id + "-casing", "streets", "line", f, { "line-color": casing, "line-width": wc }, { "line-cap": "round", "line-join": "round" }, { minzoom });
    add(id, "streets", "line", f, { "line-color": fill, "line-width": w }, { "line-cap": "round", "line-join": "round" }, { minzoom });
  };
  add("service-casing", "streets", "line", ["all", notTunnel, kind("service")], { "line-color": c["road-casing"], "line-width": zw(15, 1.6, 18, 7) }, { "line-cap": "round" }, { minzoom: 15 });
  add("service", "streets", "line", ["all", notTunnel, kind("service")], { "line-color": c.road, "line-width": zw(15, 0.8, 18, 5) }, { "line-cap": "round" }, { minzoom: 15 });
  road("minor", MINOR, zw(13, 0.6, 15, 3, 18, 12), zw(13, 1.6, 15, 4.4, 18, 14.5), 13, c.road, c["road-casing"]);
  road("mid", MID, zw(12, 0.8, 15, 4.2, 18, 15), zw(12, 2, 15, 5.6, 18, 17.5), 12, c.road, c["road-casing"]);
  road("major", MAJOR, zw(9, 0.8, 12, 2, 15, 5.2, 18, 18), zw(9, 1.8, 12, 3.4, 15, 6.8, 18, 20.5), 9, c["road-major"], c["road-major-casing"]);
  add("path", "streets", "line", ["all", notTunnel, kind(...PATH), ["!=", ["get", "kind"], "steps"]], { "line-color": c.path, "line-width": zw(15, 0.8, 18, 2.2), "line-dasharray": [3, 1.6] }, {}, { minzoom: 15 });
  add("steps", "streets", "line", kind("steps"), { "line-color": c.path, "line-width": zw(15, 1.6, 18, 4), "line-dasharray": [0.7, 0.7] }, {}, { minzoom: 15.5 });
  const noSvc = ["==", ["coalesce", ["get", "service"], ""], ""];
  add("rail-bed", "streets", "line", ["all", notTunnel, noSvc, kind(...RAIL)], { "line-color": c.rail, "line-width": zw(10, 0.6, 14, 1.4, 18, 3.4) }, {}, { minzoom: 10 });
  add("rail-dash", "streets", "line", ["all", notTunnel, noSvc, kind(...RAIL)], { "line-color": c.land, "line-width": zw(10, 0.3, 14, 0.8, 18, 2), "line-dasharray": [3, 3] }, {}, { minzoom: 14 });
  add("tram", "streets", "line", ["all", notTunnel, noSvc, kind(...TRAM)], { "line-color": c.rail, "line-width": zw(13, 0.5, 18, 2), "line-opacity": 0.8 }, {}, { minzoom: 13 });
  // labels
  const sl = { "text-font": FONT, "symbol-placement": "line", "text-letter-spacing": 0.02, "text-max-angle": 35 };
  const refOrName = ["case", named, name, ["coalesce", ["get", "ref"], ""]];
  add("lbl-street-major", "street_labels", "symbol", kind(...MAJOR, ...MID), { ...halo }, { ...sl, "text-field": refOrName, "text-size": zw(12, 10, 18, 14) }, { minzoom: 12 });
  add("lbl-street-minor", "street_labels", "symbol", ["all", named, kind(...MINOR, "service")], { ...halo }, { ...sl, "text-field": name, "text-size": zw(14, 10, 18, 13) }, { minzoom: 14.5 });
  add("lbl-street-path", "street_labels", "symbol", ["all", named, kind(...PATH)], { ...halo, "text-color": c.poi }, { ...sl, "text-field": name, "text-size": 10 }, { minzoom: 16.2 });
  add("lbl-square", "streets_polygons_labels", "symbol", named, { ...halo, "text-color": c.poi }, { "text-font": FONT, "text-field": name, "text-size": 11, "text-max-width": 7 }, { minzoom: 15.5 });
  add("lbl-water-line", "water_lines_labels", "symbol", named, { ...halo, "text-color": c["lbl-water"], "text-halo-color": c.land }, { ...sl, "text-field": name, "text-size": zw(12, 10, 18, 14), "text-letter-spacing": 0.12 }, { minzoom: 12 });
  add("lbl-water", "water_polygons_labels", "symbol", named, { ...halo, "text-color": c["lbl-water"], "text-halo-color": c.land }, { "text-font": FONT, "text-field": name, "text-size": 12, "text-letter-spacing": 0.14, "text-max-width": 8 }, { minzoom: 11 });
  // public transport
  const station = kind("station", "halt", "ferry_terminal", "bus_station", "tram_stop_station");
  add("pt-dot", "public_transport", "circle", ["all", station], { "circle-radius": zw(12, 2.5, 17, 5), "circle-color": c.surface, "circle-stroke-color": c.poi, "circle-stroke-width": 1.6 }, {}, { minzoom: 13 });
  add("pt-stop-dot", "public_transport", "circle", kind("tram_stop", "bus_stop"), { "circle-radius": zw(16, 2, 19, 4), "circle-color": c.poi, "circle-stroke-color": c.halo, "circle-stroke-width": 1 }, {}, { minzoom: 16 });
  add("lbl-station", "public_transport", "symbol", ["all", named, station], { ...halo, "text-color": c.lbl }, { "text-font": FONT, "text-field": name, "text-size": 11.5, "text-anchor": "top", "text-offset": [0, 0.7], "text-max-width": 8 }, { minzoom: 13.5 });
  add("lbl-stop", "public_transport", "symbol", ["all", named, kind("tram_stop", "bus_stop")], { ...halo, "text-color": c.poi }, { "text-font": FONT, "text-field": name, "text-size": 10, "text-anchor": "top", "text-offset": [0, 0.6], "text-max-width": 7 }, { minzoom: 17 });
  add("poi-dot", "pois", "circle", named, { "circle-radius": 2.2, "circle-color": c.poi, "circle-stroke-color": c.halo, "circle-stroke-width": 0.8 }, {}, { minzoom: 16.5 });
  add("lbl-poi", "pois", "symbol", named, { ...halo, "text-color": c.poi }, { "text-font": FONT, "text-field": name, "text-size": 10, "text-anchor": "top", "text-offset": [0, 0.5], "text-max-width": 7, "text-optional": true }, { minzoom: 16.5 });
  add("lbl-addr", "addresses", "symbol", ["!=", ["coalesce", ["get", "housenumber"], ""], ""], { ...halo, "text-color": c.poi }, { "text-font": FONT, "text-field": ["get", "housenumber"], "text-size": 9.5 }, { minzoom: 18 });
  // place names: bigger places first, small ones as the map zooms in
  const pl = (id, kinds, size, minzoom, maxzoom, upper) => add(id, "place_labels", "symbol", kind(...kinds),
    halo,
    { "text-font": FONT, "text-field": name, "text-size": size, "text-max-width": 8, "text-letter-spacing": upper ? 0.08 : 0.02, ...(upper ? { "text-transform": "uppercase" } : {}) }, { minzoom, maxzoom });
  pl("lbl-city", ["city", "town"], zw(8, 15, 12, 20), 8, 13, false);
  pl("lbl-suburb", ["suburb"], zw(11, 11.5, 15, 14), 11, 17, true);
  pl("lbl-quarter", ["quarter", "neighbourhood", "village"], zw(12, 10.5, 16, 13), 12.5, 17, true);
  pl("lbl-locality", ["locality", "hamlet", "isolated_dwelling", "farm"], zw(14, 10, 17, 12.5), 14, 19, false);
  // district borders and names (our own data)
  L.push({ id: "kreis-line", type: "line", source: "kreise", filter: ["==", ["geometry-type"], "LineString"], paint: { "line-color": c.border, "line-opacity": 0.45, "line-width": 1, "line-dasharray": [2, 3] } });
  L.push({ id: "kreis-label", type: "symbol", source: "kreise", filter: ["==", ["geometry-type"], "Point"], maxzoom: 14,
    paint: { "text-color": c.poi, "text-halo-color": c.land, "text-halo-width": 1.2 }, layout: { "text-font": FONT, "text-field": ["get", "t"], "text-size": 10.5, "text-letter-spacing": 0.1 } });
  // our places: dots below, numbered pins for the top list above
  L.push({ id: "dots", type: "circle", source: "dots", paint: { "circle-radius": ["get", "r"], "circle-color": c.accent, "circle-opacity": 0.55, "circle-stroke-color": c.surface, "circle-stroke-width": 1, "circle-stroke-opacity": 0.7 } });
  L.push({ id: "pins", type: "circle", source: "pins", paint: { "circle-radius": ["case", ["get", "sel"], 14, 11], "circle-color": c.accent, "circle-stroke-color": c.surface, "circle-stroke-width": 2 } });
  L.push({ id: "pins-num", type: "symbol", source: "pins", paint: { "text-color": c["accent-ink"] },
    layout: { "text-font": FONT, "text-field": ["get", "n"], "text-size": 12, "text-allow-overlap": true, "text-ignore-placement": true } });
  return {
    version: 8, glyphs: "mem://g/{fontstack}/{range}",
    sources: {
      osm: { type: "vector", tiles: ["mem://t/{z}/{x}/{y}"], minzoom: 4, maxzoom: 14, bounds: [W - 0.02, S - 0.02, E + 0.02, N + 0.02] },
      kreise: { type: "geojson", data: KREISE },
      dots: { type: "geojson", data: feed.dots }, pins: { type: "geojson", data: feed.pins },
    },
    layers: L,
  };
}

// --- downloads: started in <head> (window.__dl), unpacked here
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const note = t => { const n = el("mapnote"); n.hidden = !t; n.textContent = t || ""; };
class MemSource {
  constructor(buf, key) { this.buf = buf; this.key = key; }
  getKey() { return this.key; }
  async getBytes(offset, length) { return { data: this.buf.slice(offset, offset + length) }; }
}
const gunzip = u8 => new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
const archives = { lo: null, hi: null }, glyphIndex = { v: null }, glyphCache = new Map();
const tilesReady = window.__dl.lo.then(b => { archives.lo = new pmtiles.PMTiles(new MemSource(b, "lo")); });
const hiReady = window.__dl.hi.then(b => { archives.hi = new pmtiles.PMTiles(new MemSource(b, "hi")); }).catch(() => note("детали карты не загрузились"));
const glyphsReady = window.__dl.gl.then(b => {
  const dv = new DataView(b), n = dv.getUint32(0, true);
  const idx = JSON.parse(new TextDecoder().decode(new Uint8Array(b, 4, n)));
  glyphIndex.v = { idx, base: 4 + n, b };
});
const glyphPbf = async range => {
  await glyphsReady.catch(() => {});
  const g = glyphIndex.v, e = g && g.idx[range];
  if (!e) return new ArrayBuffer(0);
  if (!glyphCache.has(range)) glyphCache.set(range, gunzip(new Uint8Array(g.b, g.base + e[0], e[1])));
  return glyphCache.get(range);
};
maplibregl.addProtocol("mem", async (params, abort) => {
  const u = params.url.replace(/^mem:\/\//, "").split("/");
  if (u[0] === "g") return { data: await glyphPbf(decodeURIComponent(u[2]).replace(/\.pbf$/, "")) };
  const [z, x, y] = u.slice(1).map(Number);
  if (z > 13) await hiReady;               // the detail archive may still be on its way: tiles wait, the parent tile is shown meanwhile
  else await tilesReady.catch(() => {});
  const a = z > 13 ? archives.hi : archives.lo;
  const t = a && await a.getZxy(z, x, y, abort.signal);
  return { data: t ? t.data : new Uint8Array(0) };
});

let map;
try {
  map = new maplibregl.Map({ container: "map", style: makeStyle(), bounds: [[8.47, 47.345], [8.6, 47.43]], minZoom: 10.5, maxZoom: 19.5,
    maxBounds: [[W - 0.08, S - 0.05], [E + 0.08, N + 0.05]], attributionControl: false, dragRotate: false, pitchWithRotate: false, renderWorldCopies: false,
    pixelRatio: Math.min(window.devicePixelRatio || 1, 2), fadeDuration: 120 });
  map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: "© OpenStreetMap contributors · © Stadt Zürich" }));
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  map.touchZoomRotate.disableRotation();
} catch (e) { note("карта не запустилась: нужен WebGL"); map = null; }
const none = () => {};
const stub = { getZoom: () => 12, easeTo: none, getSource: () => null, on: none, once: none };
if (!map) map = stub;
function restyle() {
  if (!map.getStyle) return;
  const st = makeStyle();
  for (const l of st.layers) for (const [k, v] of Object.entries(l.paint || {})) map.setPaintProperty(l.id, k, v);
}
function setFeed(id, fc) { feed[id] = fc; const s = map.getSource(id); if (s) s.setData(fc); }
map.on("error", e => console.warn("map:", (e && e.error && (e.error.message || e.error)) || e, e && e.sourceId || ""));
map.on("load", () => { setFeed("dots", feed.dots); setFeed("pins", feed.pins); });
tilesReady.then(() => { progress(); map.once("idle", () => performance.mark("tiles_ready")); }, () => note("подложка не загрузилась, места остались"));
const progress = () => {
  const p = window.__dl.prog, f = k => !p[k] ? "" : p[k][1] ? Math.round(100 * p[k][0] / p[k][1]) + "%" : (p[k][0] / 1e6).toFixed(1) + " МБ";
  if (!archives.lo) note("карта: " + (f("lo") || "…"));
  else if (!archives.hi) note("детали карты: " + (f("hi") || "…"));
  else note("");
};
window.__dl.onp = progress;
hiReady.then(progress);

// ---------- marks store ----------
let db = null;
const docId = pid => pid.replace(/[^A-Za-z0-9_-]/g, "_");
function loadLocal() { try { const m = JSON.parse(localStorage.getItem("zh-marks") || "{}"); Object.entries(m).forEach(([k, v]) => state.marks.set(k, v)); } catch (e) {} }
function saveLocal() { try { localStorage.setItem("zh-marks", JSON.stringify(Object.fromEntries(state.marks))); } catch (e) {} }
let storeNote = "отметки хранятся в этом браузере";
loadLocal();
async function initStore() {
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { render(); return; }
  storeNote = "отметки сохраняются для Claude";
  const timer = setTimeout(() => { storeNote = "хранилище не ответило, отметки только здесь"; render(); }, 10000);
  db.collection("marks").onSnapshot(snap => {
    clearTimeout(timer);
    state.marks.clear();
    snap.docs.forEach(d => { const v = d.data(); if (v && v.pid && v.mark) state.marks.set(v.pid, v.mark); });
    render();
  }, () => { clearTimeout(timer); storeNote = "нет доступа к хранилищу, отметки только здесь"; db = null; render(); });
}
async function setMark(p, m) {
  const cur = state.marks.get(p.i);
  const next = cur === m ? null : m;
  if (next) state.marks.set(p.i, next); else state.marks.delete(p.i);
  render();
  if (!db) { saveLocal(); return; }
  try {
    const ref = db.collection("marks").doc(docId(p.i));
    if (next) await ref.set({ pid: p.i, name: p.n, grp: p.g, cat: p.c[0] || "", kreis: p.kr || 0, mark: next, at: new Date().toISOString() });
    else await ref.delete();
  } catch (e) { storeNote = "не удалось сохранить: " + (e && e.code || "ошибка"); saveLocal(); render(); }
}

// ---------- selection ----------
function filtered() {
  let xs = P.filter(p => p.g === state.grp);
  if (state.kreis === "out") xs = xs.filter(p => !p.kr);
  else if (state.kreis !== "all") xs = xs.filter(p => String(p.kr) === state.kreis);
  return xs.sort((a, b) => b.s - a.s || b.ns - a.ns || (b.k || 0) - (a.k || 0) || a.n.localeCompare(b.n));
}
function searched() {
  const q = norm(state.q.trim());
  return P.filter(p => p._n.includes(q)).sort((a, b) => b.s - a.s).slice(0, 60);
}

// ---------- render ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n.toLocaleString("ru-RU");

function chips() {
  const counts = {};
  P.forEach(p => counts[p.g] = (counts[p.g] || 0) + 1);
  el("chips").innerHTML = Object.keys(GROUPS).filter(g => counts[g]).map(g =>
    `<button class="chip" data-g="${g}" aria-pressed="${g === state.grp && !state.q}">${GROUPS[g]}<b>${fmt(counts[g])}</b></button>`).join("");
}
function kreisSelect() {
  const opts = [["all", "Все районы"]].concat(Array.from({ length: 12 }, (_, i) => [String(i + 1), "Kreis " + (i + 1)]), [["out", "Вне города"]]);
  el("kreis").innerHTML = opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
}
function flags(p) {
  const f = [["О", p.fd, "описание"], ["Ч", p.fh, "часы"], ["Ф", p.ff, "фото со свободной лицензией"], ["С", !!p.w, "сайт"]];
  return `<span class="flags" title="${f.map(x => (x[1] ? "есть " : "нет: ") + x[2]).join(", ")}">${f.map(x => `<i class="${x[1] ? "on" : ""}">${x[0]}</i>`).join("")}</span>`;
}
function row(p, idx) {
  const m = state.marks.get(p.i);
  const srcs = p.src.map(s => `<span class="tag on">${SRC[s] || s}</span>`).join("");
  const kr = p.kr ? "Kreis " + p.kr : "вне города";
  return `<div class="row${state.sel === p.i ? " sel" : ""}" data-i="${esc(p.i)}">
    <div class="num">${idx + 1}</div>
    <button class="name" data-open="${esc(p.i)}">${esc(p.n)}</button>
    <div class="sub"><span>${esc((p.c[0] || "").split("/")[1] || "")}</span><span>${kr}</span>
      <span class="score" title="временный рейтинг популярности из слияния">рейтинг ${p.s}</span>${flags(p)}${srcs}${p.r ? '<span class="tag warn">огр. лицензия</span>' : ""}</div>
    <div class="marks">${MARKS.map(([k, t]) => `<button class="mk" data-m="${k}" data-p="${esc(p.i)}" aria-pressed="${m === k}">${t}</button>`).join("")}</div>
  </div>`;
}
function summary(top) {
  const c = {}; top.forEach(p => { const m = state.marks.get(p.i); if (m) c[m] = (c[m] || 0) + 1; });
  const total = state.marks.size;
  const head = state.q ? `Найдено <strong>${top.length}</strong>` :
    `В топ-${top.length}: ${MARKS.map(([k, t]) => `${t} <strong>${c[k] || 0}</strong>`).join(" · ")}`;
  el("summary").innerHTML = `<span>${head}</span><span class="store">всего отмечено <strong>${total}</strong> · ${storeNote}</span>`;
}
function drawPoints(all, top) {
  const topSet = new Set(top.map(p => p.i));
  const pt = (p, props) => ({ type: "Feature", properties: { id: p.i, ...props }, geometry: { type: "Point", coordinates: [p.o, p.a] } });
  setFeed("dots", { type: "FeatureCollection", features: all.filter(p => !topSet.has(p.i)).map(p => pt(p, { r: 3 + Math.min(4, Math.sqrt(p.s) / 2) })) });
  setFeed("pins", { type: "FeatureCollection", features: top.map((p, i) => pt(p, { n: String(i + 1), sel: state.sel === p.i })) });
}
let lastAll = [];
function render() {
  if (state.detail) return renderDetail();
  chips();
  const all = state.q ? searched() : filtered();
  const top = state.q ? all : all.slice(0, state.shown);
  lastAll = all;
  summary(top);
  el("list").innerHTML = top.map(row).join("") +
    (!state.q && all.length > top.length ? `<button class="more" id="more">Показать ещё ${Math.min(PAGE, all.length - top.length)} из ${fmt(all.length - top.length)}</button>` : "") +
    `<p class="legend">О — описание, Ч — часы работы, Ф — фото со свободной лицензией, С — сайт. Рейтинг — временная эвристика слияния; его заменит шаг M1.</p>`;
  drawPoints(all, top);
  el("meta").textContent = `${fmt(DATA.counts.core)} основных мест из ${fmt(DATA.counts.all)} · пакет v${DATA.version} · ${DATA.built.slice(0, 10)}`;
}

// ---------- detail ----------
function renderDetail() {
  const p = byId.get(state.detail);
  const d = p.d || {};
  const wiki = p.wp ? `<a href="https://${p.wp[0]}.wikipedia.org/wiki/${encodeURIComponent(p.wp[1])}" target="_blank" rel="noopener">Википедия</a>` : "";
  const kv = [["Категории", p.c.join(", ")], ["Район", p.kr ? `Kreis ${p.kr}${p.q ? ", " + esc(p.q) : ""}` : "вне города"],
    ["Адрес", esc(p.ad)], ["Часы", p.h ? `<code>${esc(p.h)}</code>` : ""],
    ["Сайт", p.w ? `<a href="${esc(p.w)}" target="_blank" rel="noopener">${esc(p.w.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""))}</a>` : ""],
    ["Признаки", (p.t || []).join(", ")], ["Источники", p.src.map(s => SRC[s] || s).join(", ") + (wiki ? " · " + wiki : "")],
    ["Лицензии", esc((p.lic || []).join(", "))], ["Рейтинг", `${p.s} · источников ${p.ns}` + (p.k ? ` · языков Википедии ${p.k}` : "")], ["id", `<code>${esc(p.i)}</code>`]]
    .filter(x => x[1]);
  el("summary").innerHTML = "";
  el("list").innerHTML = `<div class="detail">
    <button class="back" id="back">← к списку</button>
    <h2>${esc(p.n)}</h2>
    ${d.t ? `<p class="desc">${esc(d.t)}<small>${esc(SRC[d.o] || d.o)} · ${esc(d.lic || "")}</small></p>` : '<p class="desc"><small>Описания нет ни в одном источнике.</small></p>'}
    <dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    <div class="marks" style="grid-column:auto">${MARKS.map(([k, t]) => `<button class="mk" data-m="${k}" data-p="${esc(p.i)}" aria-pressed="${state.marks.get(p.i) === k}">${t}</button>`).join("")}</div>
  </div>`;
  el("list").scrollTop = 0;
}
function openDetail(id) {
  const p = byId.get(id); if (!p) return;
  state.sel = id; state.detail = id;
  map.easeTo({ center: [p.o, p.a], zoom: Math.max(map.getZoom(), 15), duration: reduceMotion ? 0 : 400 });
  renderDetail();
}

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.g) { state.grp = t.dataset.g; state.q = ""; el("q").value = ""; state.shown = PAGE; state.detail = null; state.sel = null;
    try { localStorage.setItem("zh-grp", state.grp); } catch (err) {} render(); el("list").scrollTop = 0; }
  else if (t.dataset.m) { const p = byId.get(t.dataset.p); if (p) { setMark(p, t.dataset.m); } }
  else if (t.dataset.open) openDetail(t.dataset.open);
  else if (t.id === "more") { state.shown += PAGE; render(); }
  else if (t.id === "back") { state.detail = null; render(); }
});
el("q").addEventListener("input", e => { state.q = e.target.value; state.detail = null; render(); });
el("kreis").addEventListener("change", e => { state.kreis = e.target.value; state.shown = PAGE; state.detail = null; render(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { restyle(); render(); });
new MutationObserver(() => { restyle(); render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
// a tap picks the nearest of our places within a finger's width, pins before dots
map.on("click", e => {
  const r = 14, fs = map.queryRenderedFeatures([[e.point.x - r, e.point.y - r], [e.point.x + r, e.point.y + r]], { layers: ["pins", "dots"] });
  if (!fs.length) return;
  const d = f => { const q = map.project(f.geometry.coordinates); return Math.hypot(q.x - e.point.x, q.y - e.point.y) - (f.layer.id === "pins" ? 8 : 0); };
  openDetail(fs.sort((a, b) => d(a) - d(b))[0].properties.id);
});

kreisSelect();
render();
initStore();
</script>
